# Chạy cả hệ thống bằng Docker:  docker compose up --build
#   Frontend: http://localhost:8080    Backend: http://localhost:8000/docs
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ZOOGUIDE_SECRET_KEY: ${ZOOGUIDE_SECRET_KEY:-change-this-secret-key-before-deploying}
      ZOOGUIDE_CORS_ORIGINS: http://localhost:8080
    volumes:
      - zoo-data:/data

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  zoo-data:
